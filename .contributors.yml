# yamllint disable rule:line-length
# yaml-language-server: $schema=https://raw.githubusercontent.com/smorinlabs/contributors-please/main/schemas/config.schema.json
# yamllint enable rule:line-length

classifier: path
output_file: CONTRIBUTORS.md
state_file: .contributors.jsonl
in_place: true
in_place_marker_start: "<!-- contributors-please:start -->"
in_place_marker_end: "<!-- contributors-please:end -->"
entry_template: "- [{{name}}]({{profile}}) - {{title}} ({{commits}} commits)"
columns_per_row: 1
sort: contributions
min_contributions: 1
ignore:
  - Copilot
  - claude
  - blacksmith-sh[bot]
  - github-actions[bot]
  - dependabot[bot]
  - release-please-smorinlabs[bot]

identity_map:
  - login: smorin
    emails:
      - steve.morin@gmail.com

classification:
  categories:
    - id: docs
      label: Documentation Contributor
      paths:
        - "docs/**"
        - "*.md"
        - ".github/**"
    - id: code
      label: Code Contributor
      paths:
        - "src/**"
        - "tests/**"
  # Schema: classification.default is a required {id, label} object —
  # `default_category: <id>` is an unknown key and fails the action run.
  default:
    id: code
    label: Code Contributor
