# One Monday PR for version updates across Python, GitHub Actions, and Bun.
# Each ecosystem keeps a five-day cooldown and a separate security-update group.
# Wildcards include documentation dependencies and newly added packages.

version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
    # Commit formatting belongs at group level for multi-ecosystem updates.
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

updates:
  # Native uv support updates pyproject.toml and uv.lock together.
  - package-ecosystem: "uv"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    cooldown:
      default-days: 5
    labels: ["dependencies", "python"]
    # Security fixes use their own PRs instead of waiting for the weekly batch.
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    cooldown:
      default-days: 5
    labels: ["dependencies", "github-actions"]
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns: ["*"]

  # Native Bun support updates package.json and the text-based bun.lock.
  - package-ecosystem: "bun"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    cooldown:
      default-days: 5
    labels: ["dependencies", "npm"]
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns: ["*"]
