# SIMP-09 — consolidated lint workflow. Five formerly standalone
# single-purpose workflows (actionlint ITM-029, bandit ITM-027, codespell
# ITM-017, editorconfig-check ITM-011, yamllint ITM-014) run as parallel
# jobs of one file. Job names are preserved EXACTLY so branch-protection
# required-check contexts keep matching.
#
# actionlint and yamllint keep their old path-filtered behavior via the
# `lint-changes` job (a workflow-level `paths:` filter can't be applied
# per-job): on pull requests they are skipped unless matching files
# changed. Each required context first validates its selectors, then skips
# expensive steps on a valid false result. Missing or malformed selectors
# must fail; GitHub expression equality alone ignores case.
# Push events to main run everything (no base to diff against).

name: lint

on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # required checks must also report on the merge queue's speculative merge

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-changes:
    name: lint-changes
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    outputs:
      workflows: ${{ steps.detect.outputs.workflows }}
      yaml: ${{ steps.detect.outputs.yaml }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need the PR base to diff against
      - name: Detect changed paths
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "workflows=true" >> "$GITHUB_OUTPUT"
            echo "yaml=true" >> "$GITHUB_OUTPUT"
            echo "INFO: ${EVENT_NAME} event - running all lint jobs"
            exit 0
          fi
          changed=$(git diff --name-only "${BASE_SHA}...HEAD")
          wf=false
          ym=false
          # Mirrors the old actionlint.yml filter: .github/workflows/**
          if grep -qE '^\.github/workflows/' <<<"$changed"; then wf=true; fi
          # Mirrors the old yamllint.yml filter: **/*.yml, **/*.yaml, .yamllint
          if grep -qE '\.ya?ml$|^\.yamllint$' <<<"$changed"; then ym=true; fi
          echo "workflows=$wf" >> "$GITHUB_OUTPUT"
          echo "yaml=$ym" >> "$GITHUB_OUTPUT"
          echo "INFO: workflows=$wf yaml=$ym"

  actionlint:
    name: actionlint
    needs: lint-changes
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Validate lint selectors
        id: validate
        env:
          DETECTION_RESULT: ${{ needs.lint-changes.result }}
          WORKFLOWS_CHANGED: ${{ needs.lint-changes.outputs.workflows }}
          YAML_CHANGED: ${{ needs.lint-changes.outputs.yaml }}
        run: |
          set -euo pipefail
          if [ "$DETECTION_RESULT" != success ]; then
            echo "FAIL: lint change detection did not succeed" >&2
            exit 1
          fi
          for selector in "$WORKFLOWS_CHANGED" "$YAML_CHANGED"; do
            case "$selector" in
              true|false) ;;
              *) echo "FAIL: missing or invalid lint selector" >&2; exit 1 ;;
            esac
          done
          echo "run=$WORKFLOWS_CHANGED" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.validate.outputs.run == 'true'
      - name: Run actionlint
        if: steps.validate.outputs.run == 'true'
        # ITM-029 round-3 decision: enable shellcheck (GitHub-hosted runners
        # ship shellcheck; no install needed).
        uses: rhysd/actionlint@v1.7.12
        with:
          version: "1.7.7"

  yamllint:
    name: yamllint
    needs: lint-changes
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Validate lint selectors
        id: validate
        env:
          DETECTION_RESULT: ${{ needs.lint-changes.result }}
          WORKFLOWS_CHANGED: ${{ needs.lint-changes.outputs.workflows }}
          YAML_CHANGED: ${{ needs.lint-changes.outputs.yaml }}
        run: |
          set -euo pipefail
          if [ "$DETECTION_RESULT" != success ]; then
            echo "FAIL: lint change detection did not succeed" >&2
            exit 1
          fi
          for selector in "$WORKFLOWS_CHANGED" "$YAML_CHANGED"; do
            case "$selector" in
              true|false) ;;
              *) echo "FAIL: missing or invalid lint selector" >&2; exit 1 ;;
            esac
          done
          echo "run=$YAML_CHANGED" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.validate.outputs.run == 'true'
      - name: Install uv
        if: steps.validate.outputs.run == 'true'
        uses: astral-sh/setup-uv@v10.0.1
      - name: Sync locked dev tools
        if: steps.validate.outputs.run == 'true'
        # WL-001: locked via uv.lock, matching the pre-commit hook exactly.
        run: uv sync --locked --only-group dev
      - name: Run yamllint
        if: steps.validate.outputs.run == 'true'
        run: uv run --no-sync yamllint -c .yamllint .

  bandit:
    name: bandit
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Sync locked dev tools
        # WL-001: locked via uv.lock, matching the pre-push hook exactly.
        run: uv sync --locked --only-group dev
      - name: Run bandit
        # src/ path (post src-layout move); the old flat `template_press/`
        # path no longer exists, so the scan was silently covering nothing.
        run: uv run --no-sync bandit -r src/template_press/ -c pyproject.toml

  codespell:
    name: codespell
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Sync locked dev tools
        # WL-001: locked via uv.lock, matching the pre-commit hook exactly.
        run: uv sync --locked --only-group dev
      - name: Run codespell
        # Reads [tool.codespell] from pyproject.toml (ITM-015).
        run: uv run --no-sync codespell --toml pyproject.toml

  editorconfig-check:
    name: editorconfig-check
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Sync locked dev tools
        # WL-001: locked via uv.lock, matching the pre-commit hook exactly.
        run: uv sync --locked --only-group dev
      - name: Run editorconfig-checker
        # Reads .editorconfig-checker.json (ITM-009). The PyPI wheel bundles
        # the Go binary at the version uv.lock pins, so CI, lefthook and
        # `just check-editorconfig` all run the same checker. The former
        # third-party action resolved its binary from the LATEST upstream
        # release: editorconfig-checker v4.0.0 (2026-09-03) renamed every
        # release asset `ec-*` -> `editorconfig-checker-*`, and the action
        # broke on every branch the same day with "The binary
        # 'ec-linux-amd64*' not found".
        run: uv run --no-sync ec -config .editorconfig-checker.json
