# Diagnostic branch only: never merge this workflow override.
name: p10-windows-isolated
run-name: P10 isolated Windows failure cases at ${{ github.sha }}

on:
  workflow_dispatch:

permissions: {}

jobs:
  isolated-windows:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.13"
      - name: Sync locked dev environment
        run: uv sync --locked --group dev
      - name: Run failed Windows cases and their paired controls only
        run: >-
          uv run --no-sync pytest -q -vv
          tests/rebrand/test_clean_cli.py
          -k "foreign_gitfile_refuses_before_clean or
          linked_worktree_is_accepted or
          sibling_worktree_gitfile_is_refused or
          invalid_gitfile_is_a_precondition_refusal or
          linked_worktree_with_absolute_common_dir_is_accepted or
          clean_launch_oserror_is_precondition_refusal"
