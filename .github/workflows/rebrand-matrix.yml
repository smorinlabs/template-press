# R1/R2/R3 rebrand acceptance matrix (EMPIRICAL_BUGS.md, reborn as a
# repeatable harness). Live: R1/R2 clone the real py-launch-blueprint from
# GitHub; R3 presses a throwaway clone of this repo. Scheduled (network
# dependency + real clones shouldn't gate every PR) plus workflow_dispatch
# and a paths-filtered pull_request trigger for direct rebrand changes.
# Locally: `just matrix` runs the identical script.

name: rebrand-matrix

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # weekly, Monday 06:00 UTC
  pull_request:
    paths:
      - src/template_press/rebrand/**
      - tests/rebrand/**
      - scripts/rebrand_matrix.sh
      - scripts/regen-bun-lock.sh
      - scripts/regen-bun-lock.ps1
      - press/press-rules.toml

permissions: {}

concurrency:
  group: rebrand-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: r1-r2-r3-posix
            os: blacksmith-4vcpu-ubuntu-2404
            command: scripts/rebrand_matrix.sh
          - name: r3-windows
            os: windows-latest
            command: >-
              uv run pytest
              tests/rebrand/test_matrix.py::test_r3_self_press_native
              -m live -q
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      # R3's self-press runs the declared `bun install` regeneration for
      # bun.lock; without bun the press exits 2 at the plan gate.
      - name: Install bun (pinned)
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Sync locked dev env
        run: uv sync --locked --group dev

      - name: Run native acceptance
        run: ${{ matrix.command }}
