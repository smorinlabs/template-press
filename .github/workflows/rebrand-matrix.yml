# Diagnostic branch only: never merge this workflow override.
name: p11-removal-isolated
run-name: P11 Windows runner smoke at ${{ github.sha }}

on:
  workflow_dispatch:

permissions: {}

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-windows-2025, windows-latest]
    permissions:
      contents: read
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.13"
      - name: Sync locked dev environment
        run: uv sync --locked --group dev
      - name: Print runner tools and run one frozen-member case
        shell: pwsh
        run: |
          git --version
          uv --version
          git rev-parse HEAD
          Write-Host "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          uv run --no-sync python -c `
            "import platform,sys; print(sys.version); print(platform.platform())"
          foreach ($path in @(
            "src/template_press/rebrand/remove.py",
            "tests/rebrand/test_remove_dirs.py"
          )) {
            $hash = (Get-FileHash -Algorithm SHA256 $path).Hash
            Write-Host "$path=$hash"
          }
          uv run --no-sync pytest -n 0 -s -vv -ra `
            -o faulthandler_timeout=30 `
            tests/rebrand/test_remove_dirs.py::test_freeze_exact_members
