# Diagnostic branch only: never merge this workflow override.
name: p10-shortname-isolated
run-name: P10 isolated Windows short-name cases at ${{ github.sha }}

on:
  workflow_dispatch:

permissions: {}

jobs:
  isolated-windows:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.13"
      - name: Sync locked dev environment
        run: uv sync --locked --group dev
      - name: Run short-name cases and independent hardlink controls only
        run: >-
          uv run --no-sync pytest -q -vv -ra
          tests/rebrand/test_clean_file_selection.py
          -k "windows_shortname or literal_shortname_hardlink"
