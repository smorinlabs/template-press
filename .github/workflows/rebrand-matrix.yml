# Diagnostic branch only: never merge this workflow override.
name: p11-removal-isolated
run-name: P11 removal families with preserved timeout output at ${{ github.sha }}

on:
  workflow_dispatch:

permissions: {}

jobs:
  focused:
    name: focused (${{ matrix.case }})
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case: [dirs, controls, receipt, preflight, diagnostics]
    permissions:
      contents: read
    env:
      PYTHONUNBUFFERED: "1"
      P11_CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.13"
      - name: Sync locked dev environment
        run: uv sync --locked --group dev
      - name: Print tools and run isolated cases
        shell: pwsh
        run: |
          git --version
          uv --version
          git rev-parse HEAD
          Write-Host "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          uv run --no-sync python -c `
            "import platform,sys; print(sys.version); print(platform.platform())"
          foreach ($path in @(
            "src/template_press/rebrand/remove.py",
            "tests/rebrand/test_remove_dirs.py",
            "tests/rebrand/test_remove_dir_review.py"
          )) {
            $hash = (Get-FileHash -Algorithm SHA256 $path).Hash
            Write-Host "$path=$hash"
          }
          $script = @'
          import hashlib
          import os
          import subprocess
          import sys
          from pathlib import Path
          kind = os.environ["P11_CASE"]
          base = [sys.executable, "-u", "-m", "pytest", "-s", "-vv", "-ra",
                  "-o", "faulthandler_timeout=30", "--durations=5"]
          tests = {
              "dirs": "test_remove_dirs.py",
              "controls": "test_remove_dir_controls.py",
              "receipt": "test_remove_dir_receipt.py",
              "preflight": "test_remove_receipt_preflight.py",
              "diagnostics": "test_verify_remove_diagnostics.py",
          }
          selected = "tests/rebrand/" + tests[kind]
          digest = hashlib.sha256(Path(selected).read_bytes()).hexdigest()
          print("TEST_SHA256:", selected, digest, flush=True)
          subprocess.run(["git", "rev-parse", "HEAD:" + selected], check=True)
          command = base + ["-n", "auto", "--cov=template_press",
                            "--cov-report=xml", selected]
          path = Path("p11-diagnostic-pytest.log")
          print("COMMAND:", command, "PROCESS_TIMEOUT_SECONDS: 180", flush=True)
          with path.open("w", encoding="utf-8") as stream:
              proc = subprocess.Popen(command, stdout=stream,
                                      stderr=subprocess.STDOUT)
              try:
                  result = proc.wait(timeout=180)
              except subprocess.TimeoutExpired:
                  print("PYTEST_PROCESS_TIMEOUT", flush=True)
                  try:
                      subprocess.run(["taskkill", "/PID", str(proc.pid),
                                      "/T", "/F"], check=False, timeout=20)
                  except subprocess.TimeoutExpired:
                      print("TASKKILL_TIMEOUT", flush=True)
                  result = 124
          print(path.read_text(encoding="utf-8", errors="replace"), flush=True)
          raise SystemExit(result)
          '@
          $script | uv run --no-sync python -
      - name: Preserve isolated pytest output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p11-diagnostic-${{ matrix.case }}
          path: p11-diagnostic-pytest.log
          if-no-files-found: warn
          retention-days: 7
