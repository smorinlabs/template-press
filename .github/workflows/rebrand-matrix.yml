# Diagnostic branch only: never merge this workflow override.
name: p11-removal-isolated
run-name: P11 focused safety controls at ${{ github.sha }}

on:
  workflow_dispatch:

permissions: {}

jobs:
  safety:
    name: corrected directory safety controls with coverage
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.13"
      - name: Sync locked dev environment
        run: uv sync --locked --group dev
      - name: Verify exact source and focused test collection
        shell: pwsh
        run: |
          git --version
          uv --version
          git rev-parse HEAD
          Write-Host "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          $script = @'
          import hashlib
          import json
          import platform
          import sys
          from pathlib import Path
          import pytest
          expected = {
              "src/template_press/rebrand/remove.py":
                  "7a8379b67d94ae888172677045280677cbe7a963c6df3244296a7927225d070a",
              "tests/rebrand/test_remove_dir_config_inputs.py":
                  "4255a699410370722e3c4fe1cba72bc78c04011844508cebf2c22ea19e26bafe",
              "tests/rebrand/test_remove_dir_history_inputs.py":
                  "fef87241649c7c92c86f20fecf635796323485cb03776355a64a2c28ca7c4221",
              "tests/rebrand/test_remove_dir_review.py":
                  "73f969738408ec6e6f44de9a1bc6ea7235f34290a3bf800f69ad7759a25f322c",
          }
          for name, digest in expected.items():
              raw = Path(name).read_bytes()
              actual = hashlib.sha256(raw.replace(b"\r\n", b"\n")).hexdigest()
              print(json.dumps({"path": name, "normalized_sha256": actual}), flush=True)
              assert actual == digest
          class Collected:
              def pytest_collection_finish(self, session):
                  self.items = list(session.items)
          plugin = Collected()
          files = [name for name in expected if name.startswith("tests/")]
          code = pytest.main(["--collect-only", "-n", "0", "-p", "no:terminal",
              *files], plugins=[plugin])
          assert code == 0
          assert len(plugin.items) == 50
          maximum = max(len(item.nodeid) for item in plugin.items)
          assert maximum < 32767
          print(json.dumps({"python": sys.version, "platform": platform.platform(),
              "collected": len(plugin.items), "max_nodeid_chars": maximum}), flush=True)
          '@
          $script | uv run --no-sync python -
      - name: Run focused safety tests with coverage
        run: >-
          uv run --no-sync pytest -m "" -n auto
          --cov=template_press --cov-report=xml
          tests/rebrand/test_remove_dir_config_inputs.py
          tests/rebrand/test_remove_dir_history_inputs.py
          tests/rebrand/test_remove_dir_review.py
          -vv -ra --durations=10 -o faulthandler_timeout=30
