# Diagnostic branch only: never merge this workflow override.
name: p11-removal-isolated
run-name: P11 auto-worker and member-limit isolation at ${{ github.sha }}

on:
  workflow_dispatch:

permissions: {}

jobs:
  focused:
    name: focused (${{ matrix.case }})
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        case: [smoke-auto-coverage, member-limit]
    permissions:
      contents: read
    env:
      PYTHONUNBUFFERED: "1"
      P11_CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.13"
      - name: Sync locked dev environment
        run: uv sync --locked --group dev
      - name: Print tools and run isolated cases
        shell: pwsh
        run: |
          git --version
          uv --version
          git rev-parse HEAD
          Write-Host "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          uv run --no-sync python -c `
            "import platform,sys; print(sys.version); print(platform.platform())"
          foreach ($path in @(
            "src/template_press/rebrand/remove.py",
            "tests/rebrand/test_remove_dirs.py",
            "tests/rebrand/test_remove_dir_review.py"
          )) {
            $hash = (Get-FileHash -Algorithm SHA256 $path).Hash
            Write-Host "$path=$hash"
          }
          $script = @'
          import os
          import subprocess
          import sys
          from pathlib import Path
          kind = os.environ["P11_CASE"]
          base = [sys.executable, "-u", "-m", "pytest", "-s", "-vv", "-ra",
                  "-o", "faulthandler_timeout=30", "--durations=5"]
          if kind == "smoke-auto-coverage":
              command = base + ["-n", "auto", "--cov=template_press",
                  "--cov-report=xml",
                  "tests/rebrand/test_remove_dirs.py::test_freeze_exact_members"]
          else:
              command = base + ["-n", "0", "-k", "members",
                  "tests/rebrand/test_remove_dir_receipt.py::"
                  "test_history_count_and_text_limits"]
          path = Path("p11-diagnostic-pytest.log")
          print("COMMAND:", command, "PROCESS_TIMEOUT_SECONDS: 180", flush=True)
          with path.open("w", encoding="utf-8") as stream:
              proc = subprocess.Popen(command, stdout=stream,
                                      stderr=subprocess.STDOUT)
              try:
                  result = proc.wait(timeout=180)
              except subprocess.TimeoutExpired:
                  print("PYTEST_PROCESS_TIMEOUT", flush=True)
                  subprocess.run(["taskkill", "/PID", str(proc.pid), "/T", "/F"],
                                 check=False, timeout=20)
                  result = 124
          print(path.read_text(encoding="utf-8", errors="replace"), flush=True)
          raise SystemExit(result)
          '@
          $script | uv run --no-sync python -
      - name: Preserve isolated pytest output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p11-diagnostic-${{ matrix.case }}
          path: p11-diagnostic-pytest.log
          if-no-files-found: warn
          retention-days: 7
