# Diagnostic branch only: never merge this workflow override.
name: p11-removal-isolated
run-name: P11 bounded Windows pytest node-id proof at ${{ github.sha }}

on:
  workflow_dispatch:

permissions: {}

jobs:
  smoke:
    name: oversized pytest node-id proof
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.13"
      - name: Sync locked dev environment
        run: uv sync --locked --group dev
      - name: Print tools and verify bounded pytest setup failure
        shell: pwsh
        run: |
          git --version
          uv --version
          git rev-parse HEAD
          Write-Host "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          uv run --no-sync python -c `
            "import platform,sys; print(sys.version); print(platform.platform())"
          foreach ($path in @(
            "src/template_press/rebrand/remove.py",
            "tests/rebrand/test_remove_dirs.py"
          )) {
            $hash = (Get-FileHash -Algorithm SHA256 $path).Hash
            Write-Host "$path=$hash"
          }
          $script = @'
          import json
          import os
          from pathlib import Path
          import pytest
          from _pytest.runner import _update_current_test_var
          class Collected:
              def pytest_collection_finish(self, session):
                  self.items = list(session.items)
          plugin = Collected()
          code = pytest.main(["--collect-only", "-n", "0", "-p", "no:terminal",
              "tests/rebrand/test_remove_dir_receipt.py::"
              "test_bounded_read_rejects_invalid_or_oversize"], plugins=[plugin])
          assert code == 0
          assert len(plugin.items) == 2
          results = []
          for item in plugin.items:
              row = {"node_id_chars": len(item.nodeid)}
              try:
                  _update_current_test_var(item, "setup")
                  row["outcome"] = "setup variable accepted"
              except Exception as exc:
                  row.update(outcome="setup variable rejected",
                             error_type=type(exc).__name__, error=str(exc)[:240])
              finally:
                  os.environ.pop("PYTEST_CURRENT_TEST", None)
              results.append(row)
          output = json.dumps({"observations": results}, indent=2)
          Path("p11-nodeid-proof.json").write_text(output, encoding="utf-8")
          print(output, flush=True)
          assert results[0]["outcome"] == "setup variable accepted"
          assert results[1]["outcome"] == "setup variable rejected"
          print("CONFIRMED_NATIVE_PYTEST_SETUP_FAILURE", flush=True)
          '@
          $script | uv run --no-sync python -
      - name: Preserve bounded node-id observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p11-nodeid-proof
          path: p11-nodeid-proof.json
          if-no-files-found: warn
          retention-days: 7
