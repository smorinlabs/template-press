# Diagnostic branch only: never merge this workflow override.
name: p11-removal-isolated
run-name: P11 isolated Windows removal families at ${{ github.sha }}

on:
  workflow_dispatch:

permissions: {}

jobs:
  isolated-windows:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.13"
      - name: Sync locked dev environment
        run: uv sync --locked --group dev
      - name: Run directory removal families with bounded diagnostic output
        shell: pwsh
        run: |
          $testFiles = @(
            "tests/rebrand/test_remove_dirs.py",
            "tests/rebrand/test_remove_dir_controls.py",
            "tests/rebrand/test_remove_dir_receipt.py",
            "tests/rebrand/test_remove_receipt_preflight.py",
            "tests/rebrand/test_verify_remove_diagnostics.py"
          )
          if (Test-Path "tests/rebrand/test_remove_dir_review.py") {
            $testFiles += "tests/rebrand/test_remove_dir_review.py"
          }
          uv run --no-sync pytest -m "" -n auto -vv -ra `
            -o faulthandler_timeout=120 --durations=25 @testFiles
