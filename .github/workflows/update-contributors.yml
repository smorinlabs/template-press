# contributors-please workflow (py-launch-blueprint lineage).
# Secrets provisioned by repo-secrets --app contributors-please.

name: Update Contributors

on:
  push:
    branches: [main]
    # Loop protection lives HERE (not [skip ci], which would leave the bot PR
    # permanently blocked behind required checks that never run).
    paths-ignore:
      - CONTRIBUTORS.md
      - .contributors.jsonl
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  contributors-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update contributors
        uses: smorinlabs/contributors-please-action@v1.3.9
        with:
          # Input name is "app-id" (the action's defined input); the VALUE is
          # the App ID secret (this repo predates the fleet CLIENT_ID rename);
          # octokit's createAppAuth accepts either an App ID or a Client ID.
          app-id: ${{ secrets.CONTRIBUTORS_PLEASE_APP_ID }}
          private-key: ${{ secrets.CONTRIBUTORS_PLEASE_PRIVATE_KEY }}
          pat: ${{ secrets.CONTRIBUTORS_PLEASE_PAT }}
          output-file: CONTRIBUTORS.md
          state-file: .contributors.jsonl
          config-file: .contributors.yml
          mode: pull-request
          commit-message: "docs: update contributors"
