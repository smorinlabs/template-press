# projects/.gitkeep is deliberately kept (not removed): the PROJECTS.md
# stub above refers readers to per-project files "under `projects/`", so a
# pressed fork keeps an empty projects/ directory to hold them. .gitkeep is
# not a rewrite candidate, so it stays silent under the E5(a)
# declared-removal coverage warning.

