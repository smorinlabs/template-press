# This repo is its own press target (the R3 self-press in the acceptance
# matrix), so every tracked excluded file declares its neutralization
# (design 0006 §6): lockfiles regenerate under the pressed identity, and
# the release history resets to a stub instead of leaking.

# PROJECTS.md is reset below (not a default-excluded file like
# CHANGELOG.md), so it must be declared excluded from the replace pass —
# otherwise the reset target would also be rewritten, making the result
# depend on pass order.
[rules]
extra_exclude_files = ["PROJECTS.md"]

[[regenerate]]
file = "uv.lock"
command = ["uv", "lock"]

# Via a script: bun install alone never rewrites an existing lock's
# workspace name (bun 1.3.14), so the lock must be regenerated from scratch.
[[regenerate]]
file = "bun.lock"
command = ["scripts/regen-bun-lock.sh"]
platforms = ["darwin", "linux"]

[[regenerate]]
file = "bun.lock"
command = ["powershell", "-NoProfile", "-File", "scripts/regen-bun-lock.ps1"]
platforms = ["win32"]

[[reset]]
file = "CHANGELOG.md"
stub = "# Changelog\n"

# PROJECTS.md tracks this repo's own engine-development history; a pressed
# fork gets a fresh trunk instead of template-press's project backlog, so it
# resets to the header + status legend (the reusable scaffolding) and drops
# the "## Projects" table of engine-specific rows.
[[reset]]
file = "PROJECTS.md"
stub = """# PROJECTS.md

Project trunk. One row per project below; detailed scope, tasks, and
references live in per-project files under `projects/`.

Route every project-state change through a project-harness skill
(`project-add`, `project-refine`, `project-audit`) rather than editing this
file by hand.

## Status legend

| Glyph | Meaning                | Reach for…                    |
|-------|------------------------|-------------------------------|
| `[?]` | Idea                   | `project-refine` to scope     |
| `[ ]` | Scoped, not started    | start work; flip to `[~]`     |
| `[~]` | In progress            | continue; check next task     |
| `[x]` | Completed              | leave alone                   |
| `[-]` | Decided not to do      | leave alone                   |
| `[>]` | Proceeded to successor | follow the redirect           |
"""

# The difftree workflow references the template owner's action; a pressed
# fork's owner rewrite would point `uses:` at a repository that does not
# exist, so pressed outputs drop the workflow (same rule as py-launch-blueprint).
[[remove]]
file = ".github/workflows/difftree-pr-comment.yml"
reason = "uses the template owner's difftree action; the rewritten uses: path would not exist for a fork owner"

